<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>心尚植发</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="login-view" class="login-wrap">
    <form id="login-form" class="login-card">
      <h1>心尚植发</h1>
      <p class="muted">店员 / 管理员登录</p>
      <label>用户名<input id="login-username" value="admin" required /></label>
      <label>密码<input id="login-password" type="password" value="admin123" required /></label>
      <button type="submit">登录</button>
      <p id="login-error" class="error"></p>
      <p id="app-download" class="app-download hidden"></p>
    </form>
  </div>

  <div id="app-view" class="hidden">
    <aside class="sidebar">
      <div class="brand">心尚植发</div>
      <nav>
        <button data-page="customers" class="nav-btn active">客户</button>
        <button data-page="projects" class="nav-btn">项目</button>
        <button data-page="inventory" class="nav-btn">库存</button>
        <button data-page="billing" class="nav-btn">开单</button>
        <button data-page="orders" class="nav-btn">订单</button>
      </nav>
      <button id="account-btn" class="logout">修改账号</button>
      <button id="logout-btn" class="logout">退出</button>
    </aside>
    <main class="content">
      <section id="page-customers" class="page">
        <header class="page-header">
          <h2>客户管理</h2>
          <div class="row">
            <input id="customer-q" placeholder="搜索姓名/手机号" />
            <button id="customer-search">搜索</button>
            <button id="customer-new" class="primary">新建客户</button>
          </div>
        </header>
        <table>
          <thead>
            <tr><th>ID</th><th>姓名</th><th>手机</th><th>性别</th><th>生日</th><th>最近回访</th><th>备注</th><th>操作</th></tr>
          </thead>
          <tbody id="customer-tbody"></tbody>
        </table>
      </section>

      <section id="page-projects" class="page hidden">
        <header class="page-header">
          <h2>植发项目</h2>
          <button id="project-new" class="primary">新建项目</button>
        </header>
        <table>
          <thead>
            <tr><th>ID</th><th>名称</th><th>价格</th><th>规格</th><th>状态</th><th>操作</th></tr>
          </thead>
          <tbody id="project-tbody"></tbody>
        </table>
      </section>

      <section id="page-inventory" class="page hidden">
        <header class="page-header">
          <h2>库存</h2>
          <div class="row">
            <input id="inventory-q" placeholder="搜索产品名" />
            <button id="inventory-search">搜索</button>
            <button id="inventory-products">产品</button>
            <button id="inventory-in" class="primary">入库</button>
          </div>
        </header>
        <table>
          <thead>
            <tr><th>时间</th><th>产品</th></tr>
          </thead>
          <tbody id="inventory-tbody"></tbody>
        </table>
      </section>

      <section id="page-billing" class="page hidden">
        <header class="page-header"><h2>开单</h2></header>
        <form id="billing-form" class="form-grid">
          <label>客户
            <select id="billing-customer" required></select>
          </label>
          <label>备注
            <input id="billing-remark" placeholder="可选" />
          </label>
          <div class="full">
            <h3>选择项目</h3>
            <div id="billing-projects" class="check-list"></div>
          </div>
          <div class="full row between">
            <strong id="billing-total">合计：¥0</strong>
            <button type="submit" class="primary">生成订单</button>
          </div>
        </form>
      </section>

      <section id="page-orders" class="page hidden">
        <header class="page-header">
          <h2>订单列表</h2>
          <div class="row">
            <select id="order-status">
              <option value="">全部状态</option>
              <option value="PENDING">待付款</option>
              <option value="PAID">已付款</option>
              <option value="DONE">已完成</option>
              <option value="CANCELLED">已取消</option>
            </select>
            <button id="order-refresh">刷新</button>
          </div>
        </header>
        <table>
          <thead>
            <tr><th>订单号</th><th>客户</th><th>金额</th><th>状态</th><th>时间</th><th>明细</th><th>操作</th></tr>
          </thead>
          <tbody id="order-tbody"></tbody>
        </table>
      </section>
    </main>
  </div>

  <dialog id="customer-dialog">
    <form id="customer-form" method="dialog" class="dialog-form">
      <h3 id="customer-dialog-title">新建客户</h3>
      <input type="hidden" id="customer-id" />
      <label>姓名<input id="c-name" required /></label>
      <label>手机<input id="c-phone" required /></label>
      <label>性别
        <div class="row" style="gap:16px;margin-top:4px">
          <label class="row"><input type="radio" name="c-gender" value="男" /> 男</label>
          <label class="row"><input type="radio" name="c-gender" value="女" /> 女</label>
        </div>
      </label>
      <label>生日<input id="c-birthday" type="date" /></label>
      <label>备注<textarea id="c-notes" rows="3"></textarea></label>
      <div class="row end">
        <button type="button" id="customer-cancel">取消</button>
        <button type="submit" class="primary">保存</button>
      </div>
    </form>
  </dialog>

  <dialog id="visit-dialog">
    <form id="visit-form" class="dialog-form visit-dialog">
      <h3 id="visit-dialog-title">回访记录</h3>
      <input type="hidden" id="visit-customer-id" />
      <div id="visit-list" class="visit-list"></div>
      <label>回访时间<input id="v-time" type="datetime-local" step="60" required /></label>
      <label>回访内容<textarea id="v-content" rows="3" placeholder="可选"></textarea></label>
      <div class="row end">
        <button type="button" id="visit-cancel">关闭</button>
        <button type="submit" class="primary">添加回访</button>
      </div>
    </form>
  </dialog>

  <dialog id="project-dialog">
    <form id="project-form" method="dialog" class="dialog-form">
      <h3 id="project-dialog-title">新建项目</h3>
      <input type="hidden" id="project-id" />
      <label>名称<input id="p-name" required /></label>
      <label>价格<input id="p-price" type="number" min="0" step="0.01" required /></label>
      <div class="row" style="align-items:stretch">
        <label style="flex:1">数量<input id="p-graft" type="number" min="0" value="1" /></label>
        <label style="flex:1">单位
          <select id="p-unit">
            <option value="支">支</option>
            <option value="个" selected>个</option>
            <option value="盒">盒</option>
            <option value="次">次</option>
          </select>
        </label>
      </div>
      <label>描述<textarea id="p-desc" rows="3"></textarea></label>
      <label class="row"><input id="p-active" type="checkbox" checked /> 启用</label>
      <div class="row end">
        <button type="button" id="project-cancel">取消</button>
        <button type="submit" class="primary">保存</button>
      </div>
    </form>
  </dialog>

  <dialog id="stock-dialog">
    <form id="stock-form" class="dialog-form visit-dialog">
      <h3 id="stock-dialog-title">进出货</h3>
      <input type="hidden" id="stock-item-id" />
      <p id="stock-summary" class="muted"></p>
      <div id="stock-moves" class="visit-list"></div>
      <div class="row" style="align-items:stretch">
        <label style="flex:1">数量<input id="s-qty" type="number" min="1" value="1" required /></label>
      </div>
      <label>备注<input id="s-remark" placeholder="可选" /></label>
      <div class="row end">
        <button type="button" id="stock-cancel">关闭</button>
        <button type="button" id="stock-out" class="danger">出货</button>
      </div>
    </form>
  </dialog>

  <dialog id="products-dialog">
    <form method="dialog" class="dialog-form visit-dialog">
      <h3>产品</h3>
      <table>
        <thead>
          <tr><th>产品名</th><th>规格</th><th>单位</th><th>库存</th><th>操作</th></tr>
        </thead>
        <tbody id="product-tbody"></tbody>
      </table>
      <div class="row end">
        <button type="button" id="products-close">关闭</button>
        <button type="button" id="product-new" class="primary">添加产品</button>
      </div>
    </form>
  </dialog>

  <dialog id="product-dialog">
    <form id="product-form" class="dialog-form">
      <h3 id="product-dialog-title">录入产品</h3>
      <input type="hidden" id="product-id" />
      <label>产品名<input id="prod-name" required maxlength="128" /></label>
      <label>规格<input id="prod-spec" maxlength="64" placeholder="如 5ml / 10支装" /></label>
      <label>单位
        <select id="prod-unit">
          <option value="支">支</option>
          <option value="个" selected>个</option>
          <option value="盒">盒</option>
          <option value="次">次</option>
        </select>
      </label>
      <div class="row end">
        <button type="button" id="product-cancel">取消</button>
        <button type="submit" class="primary">保存</button>
      </div>
    </form>
  </dialog>

  <dialog id="inbound-dialog">
    <form id="inbound-form" class="dialog-form">
      <h3>入库</h3>
      <label>产品
        <select id="in-item" required></select>
      </label>
      <p id="in-meta" class="muted">请选择产品</p>
      <label>进货日期
        <input id="in-date" type="date" required />
      </label>
      <label>价格
        <input id="in-price" type="number" min="0" step="0.01" required />
      </label>
      <label>数量
        <input id="in-qty" type="number" min="1" value="1" required />
      </label>
      <div class="row end">
        <button type="button" id="inbound-cancel">取消</button>
        <button type="submit" class="primary">确认入库</button>
      </div>
    </form>
  </dialog>

  <dialog id="account-dialog">
    <form id="account-form" method="dialog" class="dialog-form">
      <h3>修改账号密码</h3>
      <label>用户名<input id="a-username" required minlength="2" maxlength="64" /></label>
      <label>当前密码<input id="a-current-password" type="password" required /></label>
      <label>新密码（不改可留空）<input id="a-new-password" type="password" minlength="6" /></label>
      <label>确认新密码<input id="a-confirm-password" type="password" /></label>
      <p id="account-error" class="error"></p>
      <div class="row end">
        <button type="button" id="account-cancel">取消</button>
        <button type="submit" class="primary">保存</button>
      </div>
    </form>
  </dialog>

  <script src="/app.js"></script>
</body>
</html>
